aid: bullhorn
name: Bullhorn
description: >-
  Bullhorn is a cloud-based CRM and applicant tracking system (ATS) built for the
  staffing and recruitment industry. Its REST API exposes the Bullhorn Staffing
  Object Model — Candidate, JobOrder, JobSubmission, Placement, ClientCorporation,
  ClientContact, Lead, Opportunity, Note, Appointment and related entities — with
  full CRUD, DB-backed query, Lucene full-text search, mass update, resume parsing,
  and file-attachment operations. Authentication is OAuth 2.0 (authorization_code +
  refresh_token) exchanged via a /login call for a short-lived BhRestToken session;
  API traffic routes to data-center-specific hosts discovered through the loginInfo
  endpoint. Bullhorn also publishes an official Java SDK, a Passport.js OAuth
  strategy, the Novo Elements Angular UI component library, and a CSV Data Loader CLI.
